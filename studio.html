<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio · KamalFPS</title><link rel="stylesheet" href="theme.css"></head><body>
<div class="aurora"><i></i><i></i><i></i></div>
<main class="wrap"><nav class="top" id="top"></nav><div class="eyebrow">Control room</div><h1>Run the <em>studio</em></h1><p class="mut">Update your goal and stream schedule. Changes go live on the home page.</p>
<div class="card" id="auth"><h2>Log in</h2><div class="f"><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"></div>
 <div class="f"><button class="p" id="si" style="margin:0">Log in</button><button id="su">Create account</button></div><p class="mut" id="am"></p></div>
<div id="tools" class="hide">
 <div class="card"><h2>Subscriber goal</h2><div class="f"><input id="gi" type="number" min="1" placeholder="Goal, e.g. 1000"><button class="p" id="gs" style="margin:0">Update goal</button></div><div class="mut" id="gm"></div></div>
 <div class="card"><h2>Stream schedule</h2><div id="se"></div><div class="f"><button id="sa">Add stream</button><button class="p" id="ss" style="margin:0">Publish schedule</button></div><div class="mut" id="sm"></div></div>
 <div class="card"><h2>Kick followers</h2><p class="mut" style="margin-top:0">Shown on the home page. Update it whenever you like.</p><div class="f"><input id="ki" type="number" min="0" placeholder="Followers, e.g. 250"><button class="p" id="ks" style="margin:0">Save followers</button></div><div class="mut" id="km"></div></div>
 <button id="so">Log out</button></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="app.js"></script>
<script>
let sched=[],subs=0;const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function seUI(){$("se").innerHTML=sched.map((s,i)=>`<div class="f"><select data-i="${i}" data-k="day">${DAYS.map(d=>`<option ${d===s.day?"selected":""}>${d}</option>`).join("")}</select><input type="time" data-i="${i}" data-k="time" value="${E(s.time)}"><input data-i="${i}" data-k="title" value="${E(s.title)}" placeholder="Stream title"><button data-x="${i}">Remove</button></div>`).join("")}
$("se").addEventListener("input",e=>{const d=e.target.dataset;if(d.k)sched[+d.i][d.k]=e.target.value});
$("se").addEventListener("click",e=>{if(e.target.dataset.x){sched.splice(+e.target.dataset.x,1);seUI()}});
$("sa").onclick=()=>{sched.push({day:"Mon",time:"20:00",title:""});seUI()};
$("ss").onclick=async()=>{const r=await sb.from("site").upsert({key:"schedule",value:sched}).select();$("sm").textContent=r.error?"Not saved: "+r.error.message:"Published. Check the home page."};
$("ks").onclick=async()=>{const n=Math.floor(+$("ki").value);if(!(n>=0)||$("ki").value==="")return $("km").textContent="Enter a number, 0 or higher.";const r=await sb.from("site").upsert({key:"kick",value:{followers:n,at:new Date().toISOString()}}).select();$("km").textContent=r.error?"Not saved: "+r.error.message:"Saved. Home page now shows "+n.toLocaleString()+" Kick followers."};
$("gs").onclick=async()=>{const n=Math.floor(+$("gi").value);if(!(n>0))return $("gm").textContent="Enter a number above 0.";
 const r=await sb.from("site").upsert({key:"goal",value:{target:n}}).select();
 $("gm").textContent=r.error?"Not saved: "+r.error.message:"Saved. Home page goal is now "+n.toLocaleString()+(subs>=n?". You already have "+subs.toLocaleString()+" subscribers, so set a higher goal.":".")};
async function load(){sched=(await site("schedule"))||[];const kk=await site("kick");$("ki").value=kk&&kk.followers!=null?kk.followers:"";const g=await site("goal");$("gi").value=g?g.target:"";seUI();
 try{const c=await ytChannel();subs=c.subs;if(g&&subs>=g.target)$("gm").textContent="Goal reached ("+subs.toLocaleString()+" subscribers). Set a new goal."}catch(e){}}
function setU(u){renderNav(!!u);$("auth").classList.toggle("hide",!!u);$("tools").classList.toggle("hide",!u);if(u)load()}
const need=()=>{$("am").textContent="Add your Supabase keys in config.js first.";return true};
$("si").onclick=async()=>{if(!sb&&need())return;const r=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});r.error?$("am").textContent=r.error.message:setU(r.data.user)};
$("su").onclick=async()=>{if(!sb&&need())return;const r=await sb.auth.signUp({email:$("em").value,password:$("pw").value});$("am").textContent=r.error?r.error.message:"Account created. Confirm your email if asked, then log in."};
$("so").onclick=async()=>{await sb.auth.signOut();setU(null)};
if(sb)sb.auth.getSession().then(r=>setU(r.data.session&&r.data.session.user));
</script></body></html>
