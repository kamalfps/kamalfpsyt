<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KamalFPS</title><link rel="stylesheet" href="theme.css"></head><body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="wrap"><nav class="top" id="top"></nav>
<section class="hero">
 <h1>Becoming famous before 2027, one stream at a time.</h1>
 <div class="counts"><div><div class="lab"><span class="dot"></span>Live subscribers</div><div class="num" id="subs">0</div></div>
  <div class="small"><div class="lab">Days left in 2026</div><div class="num" id="days">0</div></div></div>
 <div id="gl" class="hide"><div class="bar"><i id="gb"></i></div><div class="mut" id="gt" style="margin-top:10px"></div></div>
 <p id="yerr" class="mut"></p>
 <a class="btn" href="https://youtube.com/@kamalfps?sub_confirmation=1">Subscribe on YouTube</a>
</section>
<div class="marq"><div id="mq"></div></div>
<section class="grid2"><div class="card rv"><h2>Stream schedule</h2><div id="sch" class="mut">No streams scheduled yet.</div></div>
<div class="card rv"><h2>Top videos</h2><div id="top5" class="mut">Loading…</div></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="app.js"></script>
<script>
let subs=0,goal=0,first=true;
countTo($("days"),DAYS_LEFT());
$("mq").innerHTML=Array(8).fill([ "Road to 2027",DAYS_LEFT()+" days left","Live streams","KamalFPS"]).flat().map(x=>`<span>${x}</span>`).join("");
function goalUI(){const g=$("gl");if(!goal){g.classList.add("hide");return}g.classList.remove("hide");
 requestAnimationFrame(()=>{$("gb").style.width=Math.min(100,subs/goal*100)+"%"});
 $("gt").textContent=subs>=goal?`Goal of ${goal.toLocaleString()} reached. Next goal coming soon.`:`${subs.toLocaleString()} of ${goal.toLocaleString()} subscribers, ${(goal-subs).toLocaleString()} to go`}
try{const k=JSON.parse(localStorage.getItem("kf")||"null");if(k){subs=k;$("subs").textContent=k.toLocaleString()}}catch(e){}
async function tick(){try{const c=await ytChannel(true);$("yerr").textContent="";subs=c.subs;
  if(c.hidden)$("subs").textContent="Hidden";else if(first)countTo($("subs"),subs);else $("subs").textContent=subs.toLocaleString();
  first=false;try{localStorage.setItem("kf",JSON.stringify(subs))}catch(e){}goalUI();
  $("top5").innerHTML=c.top.map(i=>`<div class="row"><a href="https://youtu.be/${i.id}">${E(i.snippet.title)}</a><span class="mut">${(+i.statistics.viewCount).toLocaleString()} views</span></div>`).join("")||"No videos yet."}
 catch(e){$("yerr").textContent="Live count unavailable: "+e.message}}
(async()=>{const g=await site("goal");goal=g?+g.target:0;goalUI();const s=await site("schedule");
 if(s&&s.length)$("sch").innerHTML=s.map(x=>`<div class="row"><b>${E(x.day)} ${E(x.time)}</b><span>${E(x.title)}</span></div>`).join("")})();
tick();setInterval(tick,60000);
</script></body></html>
